<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="100%" stop-color="#F2A488"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81B29A"/>
      <stop offset="100%" stop-color="#3F8F6B"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Белая тарелка -->
  <circle cx="512" cy="512" r="290" fill="white"/>
  <circle cx="512" cy="512" r="210" fill="none" stroke="#E07A5F" stroke-width="18" opacity="0.2"/>

  <!-- Лист с черенком, повёрнутый на 45° -->
  <g transform="rotate(45 512 512)">
    <!-- Черенок (удлинён) -->
    <line x1="512" y1="655" x2="512" y2="740" stroke="#3F8F6B" stroke-width="26" stroke-linecap="round"/>

    <!-- Лист -->
    <path d="M 512 340 Q 640 400 640 520 Q 640 630 512 660 Q 384 630 384 520 Q 384 400 512 340 Z" fill="url(#leaf)"/>

    <!-- Прожилка -->
    <line x1="512" y1="360" x2="512" y2="650" stroke="white" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>